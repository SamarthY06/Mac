name: Feature request
description: Something Mac should do, or do differently.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the situation first, then the behaviour you want. Mac is model-driven: many "features" are a prompt or a setting rather than new code, and it helps to know which you expect.
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: What you were trying to do, and what Mac does today.
      placeholder: I ask Mac to summarise a long thread in a group and it reads the whole thing back to me.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you want instead
      description: The behaviour, as a user would see or hear it. A sample exchange is ideal.
      placeholder: |
        Me: "Mac, what did I miss?"
        Mac: three lines, newest first, no quotes.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Behaviour (prompt, model judgement)
        - Setting (config.toml, Settings window, scripts/mac)
        - New capability (new tool, app, integration)
        - Safety gate (allow, deny, confirm)
        - Install, packaging, platform
        - Not sure
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety
      description: Could this let Mac do something irreversible, read something sensitive, or act on someone else's message? Say how you would keep the gate in charge.
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
      description: Settings, phrasings or workarounds you tried already.
