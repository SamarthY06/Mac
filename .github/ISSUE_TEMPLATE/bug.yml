name: Bug report
description: Something did not work the way the docs say.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste message text, group names, phone numbers or anything from `~/.mac-agent/`. Logs in `~/Library/Logs/Mac/` carry no message text and are safe to attach.
        For a security problem, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you said or sent, what Mac did, and what you expected instead.
      placeholder: |
        Said: "Hey Mac, what's on my calendar tomorrow?"
        Mac: said "On it." and then nothing for a minute.
        Expected: an answer within a few seconds.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Voice (wake word, listening, speech, barge-in)
        - Claude / tasks (Chrome, apps, files)
        - Safety gate (blocked or confirmed actions)
        - WhatsApp (bridge, groups, services)
        - Install / update / uninstall
        - App (menu bar, HUD, settings, permissions)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenMac version
      description: The contents of `VERSION`, or `git rev-parse --short HEAD` in `~/OpenMac`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.1, MacBook Pro M2
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `macctl doctor` and `scripts/mac status`
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `~/Library/Logs/Mac/`. They contain no message text. Trim to the minute around the problem.
      render: shell
