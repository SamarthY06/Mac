name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff + fast tests)
    runs-on: macos-15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: daemon/uv.lock
      - name: Sync
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q -m "not live and not models and not perf"

  swift:
    name: Swift (app)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release --product MacApp
      - name: Test
        run: swift test

  go:
    name: Go (WhatsApp bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges/whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridges/whatsapp/go.mod
          cache-dependency-path: bridges/whatsapp/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n install.sh scripts/*.sh scripts/mac
