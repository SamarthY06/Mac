[project]
name = "macd"
version = "0.1.0"
description = "Mac: always-on voice agent for macOS powered by Claude Code"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "sherpa-onnx>=1.12.0",
  "kokoro-onnx>=0.4.9",
  "sounddevice>=0.5.0",
  "numpy>=1.26",
  "soxr>=0.5",
  "livekit>=1.0.0",
  "livekit-api>=1.0.0",
  "sentencepiece>=0.2.0",
  "tomli-w>=1.0",
  "pyobjc-framework-Cocoa>=10.3",
  "pyobjc-framework-Quartz>=10.3",
  "pyobjc-framework-ApplicationServices>=10.3",
]

[project.scripts]
macd = "macd.__main__:main"
macctl = "macd.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["models: needs downloaded speech models", "live: needs claude login / hardware"]
